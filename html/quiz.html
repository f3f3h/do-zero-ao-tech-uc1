<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Vocacional - Do Zer0 ao Tech</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../css/quiz.css">
    <link rel="stylesheet" href="../css/acessibilidade.css">
</head>
<body>

    <header class="header header-dark">
        <div class="header-container">
            <div class="logo">
                <img src="../imagens/LUMI LOGO.png" alt="Lumi logo">
                <span class="logo-text-light">DoZeroAoTech</span>
            </div>
            <nav class="nav-menu">
                <a href="../index.html" class="nav-light">Home</a>
                <a href="testeVocacional.html" class="active nav-light">Teste Vocacional</a>
                <a href="carreiras.html" class="nav-light">Carreiras</a>
                <a href="sobre.html" class="nav-light">Sobre</a>
            </nav>
    </header>

    <main class="main-container">
        <div class="quiz-wrapper">
            <!-- Container do Quiz -->
            <div id="quiz-container">
                <div class="progress-header">
                    <span id="progresso-texto">Pergunta 1 de 8</span>
                    <span id="porcentagem-texto">12.5%</span>
                </div>
                <div class="progress-bar-bg">
                    <div id="progress-bar-fill" class="progress-bar-fill"></div>
                </div>

                <h2 id="pergunta" class="quiz-question-title">Carregando pergunta...</h2>

                <div id="opcoes" class="quiz-options-container"></div>

                <div class="quiz-action-container">
                    <button id="btn-proxima" class="btn-primary" onclick="confirmarAvanco()" disabled>Próxima pergunta</button>
                </div>
            </div>

            <!-- Container do Resultado -->
            <div id="resultado-container" class="escondido">
                <h2>Resultado do seu Teste Vocacional</h2>
                <p id="resultado-texto" class="resultado-destaque"></p>
                <div class="center-btn-container">
                    <button class="btn-primary" onclick="reiniciarQuiz()">Refazer Teste</button>
                </div>
            </div>
        </div>
    </main>

<!-- Rodapé Completo -->
    <footer class="footer footer-dark">
        <div class="footer-container">
            
            <!-- Links de Navegação -->
            <div class="footer-nav">
                <a href="../home.html">Home</a>
                <a href="testeVocacional.html">Teste Vocacional</a>
                <a href="carreiras.html">Carreiras</a>
                <a href="sobre.html">Sobre Nós</a>
            </div>

            <!-- Links Sociais -->
            <div class="footer-social">
                <a href="https://www.instagram.com/" target="_blank">Instagram</a>
                <a href="https://br.linkedin.com/" target="_blank">LinkedIn</a>
            </div>

            <!-- Direitos Autorais -->
            <div class="footer-copyright">
                <p>&copy; 2026 Do 0 ao Tech. Todos os direitos reservados.</p>
            </div>
            
        </div>
    </footer>

    <script src="../js/quiz.js"></script>

    <!--Menu de acessibilidade -->
    <button class="botao-acessibilidade" id="botaoAcessibilidade" aria-label="Abrir opções de acessibilidade" aria-expanded="false">
        ♿
    </button>

    <div class="menu-acessibilidade" id="menuAcessibilidade" aria-hidden="true">
        <div class="cabecalho-acessibilidade">
            <h2>Acessibilidade</h2>
            <button id="fecharAcessibilidade" aria-label="Fechar menu">×</button>
        </div>

        <div class="opcoes-acessibilidade">
            <button class="opcao-acessibilidade" id="aumentarTexto">
                <span>🔠</span>
                <div>
                    <strong>Aumentar texto</strong>
                    <small>Aumentar o tamanho da fonte</small>
                </div>
            </button>

            <button class="opcao-acessibilidade" id="diminuirTexto">
                <span>🔡</span>
                <div>
                    <strong>Diminuir texto</strong>
                    <small>Diminuir o tamanho da fonte</small>
                </div>
            </button>

            <button class="opcao-acessibilidade" id="lerAoPassar">
                <span>🖱️</span>
                <div>
                    <strong>Ler ao passar o mouse</strong>
                    <small>Ouvir o conteúdo ao posicionar o cursor</small>
                </div>
            </button>

            <button class="opcao-acessibilidade" id="altoContraste">
                <span>◐</span>
                <div>
                    <strong>Alto contraste</strong>
                    <small>Aumentar o contraste das cores</small>
                </div>
            </button>

            <button class="opcao-acessibilidade" id="contrasteNegativo">
                <span>◑</span>
                <div>
                    <strong>Contraste negativo</strong>
                    <small>Inverter as cores da página</small>
                </div>
            </button>

            <button class="opcao-acessibilidade" id="destacarLinks">
                <span>🔗</span>
                <div>
                    <strong>Destacar links</strong>
                    <small>Facilitar a identificação dos links</small>
                </div>
            </button>

            <button class="opcao-acessibilidade restaurar" id="restaurarAcessibilidade">
                <span>↩️</span>
                <div>
                    <strong>Restaurar padrão</strong>
                    <small>Voltar às configurações originais</small>
                </div>
            </button>
        </div>
    </div>

    <script src="js/acessibilidade.js"></script>

</body>
</html>
